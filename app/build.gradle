plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.cocode.vcode.ide'
    compileSdk 36

    defaultConfig {
        applicationId "com.cocode.vcode.ide"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['plugin.properties', 'about.html', 'META-INF/eclipse.inf']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.activity
    implementation libs.fragment
    
    coreLibraryDesugaring libs.desugar.jdk.libs

    // Architecture
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // Git — the ONE essential library
    implementation libs.org.eclipse.jgit
    implementation libs.slf4j.api
    implementation libs.slf4j.nop
    implementation libs.preference

    implementation libs.security.crypto
    implementation libs.documentfile

    implementation libs.glide

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:6.7.0.202309050840-r'
}